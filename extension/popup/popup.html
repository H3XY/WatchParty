<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchParty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #ff6b6b;
      --accent2: #4ecdc4;
      --text: #f0f0f5;
      --muted: #6b6b80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      min-height: 280px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }
    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--accent); }

    .content { padding: 20px; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Home screen */
    .tagline {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
      font-weight: 300;
    }

    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--accent); }
    .input-group input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      margin-bottom: 10px;
    }
    .btn-primary:hover { background: #ff5252; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

    /* Room code screen */
    .room-code-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .room-code-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .room-code {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 8px;
      color: var(--accent);
    }
    .share-url {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      word-break: break-all;
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ecdc4;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-bar {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
    }
    .members-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .member-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .error-msg {
      color: var(--accent);
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }
    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0 10px;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .btn-sm {
      width: auto;
      padding: 8px 16px;
      font-size: 12px;
    }
    .flex-row { display: flex; gap: 8px; }
    .flex-row .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎬</div>
    <div class="logo-text">Watch<span>Party</span></div>
  </div>

  <div class="content">
    <!-- Screen 1: Home -->
    <div class="screen active" id="screen-home">
      <p class="tagline">Sync any stream with up to 3 friends</p>
      <div class="input-group">
        <label>Your name</label>
        <input type="text" id="host-name" placeholder="Enter your name..." maxlength="20" />
      </div>
      <button class="btn btn-primary" id="btn-create">🎬 Create a Party</button>
      <div class="divider">or join with a code</div>
      <div class="input-group">
        <label>Room code</label>
        <input type="text" id="join-code" placeholder="8-digit code..." maxlength="8" style="text-transform:uppercase;letter-spacing:3px;" />
      </div>
      <button class="btn btn-secondary" id="btn-join">Join Party →</button>
      <div class="error-msg" id="home-error"></div>
    </div>

    <!-- Screen 2: Hosting -->
    <div class="screen" id="screen-hosting">
      <div class="room-code-box">
        <div class="room-code-label">Room Code</div>
        <div class="room-code" id="display-code">——</div>
        <div class="share-url" id="display-url"></div>
      </div>
      <div class="status-bar">
        <span class="status-dot"></span>
        <span id="host-status">Waiting for guests...</span>
      </div>
      <div class="members-row" id="members-row"></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">
        Share the code or link above. The party chat overlay will appear on your streaming tab.
      </p>
      <button class="btn btn-secondary" id="btn-end-party">End Party</button>
    </div>

    <!-- Screen 3: Join (guest) -->
    <div class="screen" id="screen-joined">
      <div class="status-bar">
        <span class="status-dot"></span>
        <span>Connected to party</span>
      </div>
      <div class="room-code-box">
        <div class="room-code-label">Room</div>
        <div class="room-code" id="joined-code" style="font-size:24px;letter-spacing:4px;"></div>
      </div>
      <div class="members-row" id="joined-members-row"></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">
        Open the streaming page to see the chat overlay and stay in sync!
      </p>
      <button class="btn btn-secondary" id="btn-leave-party">Leave Party</button>
    </div>
  </div>

  <script src="../lib/socket.io.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
